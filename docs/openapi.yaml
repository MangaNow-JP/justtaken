openapi: 3.1.0
info:
  title: JustTaken capture and publication API
  version: 0.3.0
  description: ローカル実装。外部アプリ登録と本番前検証は別工程。設定未完了の認証はfail closed。
servers:
  - url: http://localhost:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /health:
    get:
      summary: 稼働状態と設定済み機能
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '206':
          description: メディアの部分応答
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
  /v1/policy:
    get:
      summary: 撮影・公開ポリシーと利用可能なログイン方法
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '206':
          description: メディアの部分応答
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
  /.well-known/capture-jwks.json:
    get:
      summary: 現在の検証票署名公開鍵（秘密値を含まない）
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '206':
          description: メディアの部分応答
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
  /v1/auth/challenge:
    post:
      summary: ログインチャレンジ発行
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '201':
          description: 作成成功
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  enum:
                    - apple
                    - google
                codeChallenge:
                  type: string
                  description: Googleでは必須。native PKCE verifierのS256
  /v1/auth/google/callback:
    get:
      summary: Google認可codeの交換とアプリへのhandoff
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '206':
          description: メディアの部分応答
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
  /v1/auth/exchange:
    post:
      summary: Apple tokenまたはGoogle handoff codeの交換
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '201':
          description: 作成成功
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  enum:
                    - apple
                    - google
                challengeId:
                  type: string
                idToken:
                  type: string
                code:
                  type: string
                verifier:
                  type: string
  /v1/auth/refresh:
    post:
      summary: 端末のrefresh rotation。再利用時はtoken family失効
      security: []
      responses:
        '200':
          description: 成功。POST作成時は201、範囲応答は206
        '201':
          description: 作成成功
        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
          description: 頻度制限
        '503':
          description: 設定未完了または一時障害
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
  /v1/auth/logout:
    post:
      summary: この端末からログアウト

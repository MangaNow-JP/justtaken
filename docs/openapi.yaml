        '400':
          description: 形式不正
        '401':
          description: 認証失効/未認証
        '403':
          description: 証明または権限拒否
        '404':
          description: 存在しない、または閲覧不可
        '409':
          description: 状態・再送・容量の競合
        '422':
          description: メディア不一致
        '429':
